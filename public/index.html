<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solari Split-Flap Board • Bay Area & SJC Hub</title>
    <link rel="stylesheet" href="css/solari.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1b20'/><text y='70' x='20' font-size='65' fill='%23f5b722' font-family='sans-serif' font-weight='bold'>S</text></svg>">
</head>
<body>

    <!-- Industrial Station Board Housing -->
    <main class="station-housing" role="region" aria-label="Split-Flap Departures Board">
        
        <!-- Board Top Header -->
        <header class="board-header-bar">
            <div class="station-identity">
                <span class="solari-logo">Solari</span>
                <h1 class="station-title" id="stationTitle">SAN JOSE DIRIDON / SJC • REGIONAL TRANSIT HUB</h1>
            </div>
            <div class="station-clock-box">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span>Live</span>
                </div>
                <div class="station-clock" id="stationClock">12:00:00</div>
            </div>
        </header>

        <!-- Column Headers -->
        <div class="column-headers" aria-hidden="true">
            <span class="col-hdr-time">TIME</span>
            <span class="col-hdr-space1"></span>
            <span class="col-hdr-service">SERVICE</span>
            <span class="col-hdr-space2"></span>
            <span class="col-hdr-destination">DESTINATION</span>
            <span class="col-hdr-space3"></span>
            <span class="col-hdr-track">TRK/GT</span>
            <span class="col-hdr-space4"></span>
            <span class="col-hdr-status">STATUS</span>
        </div>

        <!-- The 3D Split-Flap Display Matrix -->
        <div class="solari-grid" id="solariGrid" role="table" aria-label="Departures">
            <!-- Dynamically populated by SplitFlapBoard -->
        </div>

        <!-- Board Footer Info Bar -->
        <footer class="board-info-bar">
            <div class="agency-status-pills">
                <div class="agency-pill"><span class="agency-pill-dot"></span> SJC Airspace (ADS-B)</div>
                <div class="agency-pill"><span class="agency-pill-dot"></span> BART Live API</div>
                <div class="agency-pill"><span class="agency-pill-dot"></span> Amtraker SJC</div>
                <div class="agency-pill"><span class="agency-pill-dot"></span> Caltrain Peninsula</div>
                <div class="agency-pill"><span class="agency-pill-dot"></span> VTA Light Rail</div>
            </div>
            <div id="lastUpdatedText">Live Feed Active</div>
        </footer>

    </main>

    <!-- Kiosk / Screensaver Controls Overlay (Fades out when mouse is idle) -->
    <nav class="controls-overlay" aria-label="Board Controls">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="unified">Unified Hub</button>
            <button class="mode-btn" data-mode="sjc">SJC Flights</button>
            <button class="mode-btn" data-mode="caltrain">Caltrain</button>
            <button class="mode-btn" data-mode="bart">BART</button>
            <button class="mode-btn" data-mode="amtrak">Amtrak</button>
            <button class="mode-btn" data-mode="vta">VTA Light Rail</button>
        </div>
        <div class="tool-actions">
            <button class="icon-btn active" id="cycleToggleBtn" title="Auto-cycles through modes every 25s">⟳ Auto-Cycle: ON</button>
            <button class="icon-btn active" id="soundToggleBtn" title="Toggle mechanical flap sound (Key: M)">🔊 Sound: ON</button>
            <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen (Key: F)">⛶ Fullscreen</button>
        </div>
    </nav>

    <!-- Split-Flap Scripts -->
    <script src="js/flap-audio.js"></script>
    <script src="js/split-flap.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
